services:
  - type: web
    name: floodcast-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://floodcast-cfq9.onrender.com,http://localhost:5173,http://127.0.0.1:5173
  - type: web
    name: floodcast
    runtime: static
    buildCommand: npm ci --prefix frontend && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: floodcast-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
